# ============================================================================
# Indexing config: the embedding model and the BM25 settings of the knowledge base
# (units of the approved answers -> Postgres, pgvector).
# Schema + validation: backend/app/indexing/config.py.
#
# `dimensions` must match the vector column of the units table
# (backend/migrations/versions/0003_pipeline.py); a different width needs a new
# migration and a re-embedding of every unit.
# ============================================================================

embeddings:
  model: bge-m3             # docker compose exec ollama ollama pull bge-m3
  batch_size: 32
  truncate: true
  dimensions: 1024          # checked against the model output and the table column

text_field: contextual_text # contextual_text | text — what gets embedded

# BM25 side of hybrid retrieval, stored as the sparse vector of every unit.
sparse:
  k1: 1.2
  b: 0.75
  stemmer: english          # Snowball language, or null
