# ============================================================================
# Chunking config — consumed by scripts/chunk_parsed_documents.py
# (s3://$S3_BUCKET/parsed/ -> s3://$S3_BUCKET/chunked/).
# Schema + validation: backend/app/chunking/config.py.
#
# Adding a chunking method: write backend/app/chunking/<name>.py, add its
# config model/field and `method` literal in config.py, register it in
# backend/app/chunking/__init__.py, then add a sibling block below.
# Changing anything the active method uses re-chunks all documents (the
# config hash is stored on every output object).
# ============================================================================

method: semantic            # which method block below is used

documents:
  # Documents whose source.metadata.role is listed here are not chunked. Empty: every source
  # goes to the vector index. Sources under `excluded:` (with an id) in config/sources.yaml are
  # skipped by every stage regardless. The ICD Foundation entity and CDDR PDF are excluded there
  # (duplicates of the MMS entity); level0_structured (MMS) is the only ICD text indexed, so do
  # not skip that role.
  skip_roles: []

embeddings:                 # shared by every method that needs vectors
  model: bge-m3             # docker compose exec ollama ollama pull bge-m3
  batch_size: 64
  truncate: true

tokenizer: BAAI/bge-m3      # HF tokenizer used to measure chunk size (null = word count)

semantic:
  sentence_split: true      # paragraphs -> sentences; list items and tables stay atomic units
  buffer_size: 1            # neighbours on each side joined into a unit's embedding text
  breakpoint:
    type: percentile        # percentile | std_dev | interquartile | gradient
    amount: 90
  min_tokens: 80
  max_tokens: 512
  respect_sections: true    # section boundaries are hard breaks...
  merge_scope_level: 1      # ...but undersized chunks merge with neighbours sharing path[:N]
  contextual_header: true   # also store "H1 > H2 > H3\n\n<text>" as contextual_text
