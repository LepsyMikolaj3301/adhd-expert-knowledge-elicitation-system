services:
  ollama:
    image: ollama/ollama:latest
    ports:
      # This machine only. The Azure VM comes in through `tailscale serve`, which forwards the tailnet
      # port here (notes/azure-setup-guide.md, step 5); containers use the compose network.
      - "127.0.0.1:11434:11434"
    volumes:
      # Host path for models (bind mount). Falls back to the named volume if unset.
      - ${OLLAMA_DATA_PATH:-ollama-data}:/root/.ollama
    restart: unless-stopped
    environment:
      # Defaults equal Ollama's own (5m); raise them in .env for big models, see .env.example.
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-5m}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    # Uncomment when running on a machine with an NVIDIA GPU:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The grammar checker of the proofreading job
  languagetool:
    image: erikvl87/languagetool:6.8
    ports:
      - "127.0.0.1:8010:8010"  # as Ollama's port above
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web UI for Postgres: docker compose --profile tools up -d pgadmin  ->  http://<host>:5050
  # Login-free (single-user desktop mode); only expose it on a private network such as Tailscale.
  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Dev workspace: the devcontainer attaches here. Full toolchain, scripts, notebooks, experiments.
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      LANGUAGETOOL_URL: http://languagetool:8010
      # `npm run dev` inside this container: the API is the rag-backend service, not localhost.
      VITE_API_PROXY_TARGET: http://rag-backend:8000
      PYTHONPATH: /workspace/backend
      # Keeps ~/.claude.json inside the claude-config volume too, not just ~/.claude.
      # TODO: DELETE LATER
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    # GPU for experiments (torch / docling / local LMs). Needs the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace:cached
      # Dev-only caches
      - uv-cache:/home/vscode/.cache/uv
      - hf-cache:/home/vscode/.cache/huggingface
      # Claude Code sessions, memory and login survive container rebuilds.
      # TODO: DELETE LATER
      - claude-config:/home/vscode/.claude
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # One-shot: applies the database migrations of the `app` schema before the API and worker start.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
    volumes:
      - ./backend:/workspace/backend
      - ./packages:/workspace/packages
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Slim, deployable-style backend image. Start with: docker compose --profile app up
  rag-backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./backend:/workspace/backend
      - ./packages:/workspace/packages
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

  # Runs the background jobs: proofreading and linking the answers (LanguageTool, the classifier and
  # the enhancement model), cutting the approved ones into units, ingesting them (embeddings). Needs
  # Ollama with the models in .env (CLASSIFIER_MODEL, ENHANCE_MODEL) and bge-m3. Without
  # LanguageTool the grammar pass is skipped, not failed.
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      LANGUAGETOOL_URL: http://languagetool:8010
    volumes:
      - ./backend:/workspace/backend
      - ./packages:/workspace/packages
      # Next to backend/, where settings.project_root looks for them.
      - ./prompts:/workspace/prompts:ro
      - ./config:/workspace/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      languagetool:
        condition: service_started
    restart: unless-stopped

  # The web app with hot reload: http://localhost:5173. Proxies /api to rag-backend (see
  # frontend/vite.config.ts), so it needs no CORS setup either. Start: docker compose --profile app up -d
  frontend:
    profiles: [app]
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://rag-backend:8000
    volumes:
      - ./frontend:/app
      # Not the host's node_modules: those were installed for another platform.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - rag-backend
    restart: unless-stopped

  # Headless browser for Playwright MCP. Drives the app through the compose
  # network: http://frontend:5173. Start: docker compose --profile app --profile browser up -d
  # Register once, inside the dev container: claude mcp add --transport http playwright http://playwright:8931/mcp
  playwright:
    profiles: [browser]
    image: mcr.microsoft.com/playwright/mcp:latest
    # The image's entrypoint already passes --headless --browser chromium --no-sandbox.
    command: ["--host", "0.0.0.0", "--port", "8931", "--allowed-hosts", "*"]
    # Only the dev container needs it; it is not published to the host (anyone reaching it can drive a browser).
    expose:
      - "8931"
    init: true
    restart: unless-stopped

  # The production image, run locally the way the Azure VM runs it: http://localhost:8080. It looks the
  # backend up per request, so start the backend first (--profile app); nothing orders them here.
  # Start: docker compose --profile preview up -d --build frontend-preview
  frontend-preview:
    profiles: [preview]
    build:
      context: ./frontend
      dockerfile: ../infra/frontend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_UPSTREAM_URL: http://rag-backend:8000
      API_HOST: rag-backend

volumes:
  frontend-node-modules:
  ollama-data:
  postgres-data:
  pgadmin-data:
  uv-cache:
  hf-cache:
  claude-config:
