services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Host path for models (bind mount). Falls back to the named volume if unset.
      - ${OLLAMA_DATA_PATH:-ollama-data}:/root/.ollama
    restart: unless-stopped
    # Uncomment when running on a machine with an NVIDIA GPU:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web UI for Postgres: docker compose --profile tools up -d pgadmin  ->  http://<host>:5050
  # Login-free (single-user desktop mode); only expose it on a private network such as Tailscale.
  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  graphdb:
    image: ontotext/graphdb:11.5.2
    ports:
      - "${GRAPHDB_HOST_PORT:-7200}:7200"
    environment:
      GDB_JAVA_OPTS: >-
        -Xms1g -Xmx${GRAPHDB_HEAP_SIZE:-2g}
        -Dgraphdb.home=/opt/graphdb/home
    volumes:
      - graphdb-data:/opt/graphdb/home
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7200/rest/repositories >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates the GraphDB repository if it does not exist yet (idempotent).
  graphdb-init:
    image: curlimages/curl:latest
    depends_on:
      graphdb:
        condition: service_healthy
    environment:
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
    volumes:
      - ./backend/db/graphdb:/init:ro
    entrypoint: ["sh", "/init/init-repo.sh"]
    restart: "no"

  # MinIO no longer publishes images to Docker Hub/quay.io; Chainguard rebuilds them from upstream.
  # Free tier only has floating tags, so pin by digest (minio RELEASE.2026-09-22T19-25-18Z).
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the S3 bucket and the app user if they do not exist yet (idempotent).
  minio-init:
    # -dev variant ships a shell, needed for the init script.
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:f0b1d3d6ae12391d9bbe88345dee6da67027c93cda18dc5c9a463c2cc7d61b29
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rag-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rag-app-secret}
    volumes:
      - ./backend/db/minio:/init:ro
    entrypoint: ["sh", "/init/init-bucket.sh"]
    restart: "no"

  # Dev workspace: the devcontainer attaches here. Full toolchain, scripts, notebooks, experiments.
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rag-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rag-app-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      PYTHONPATH: /workspace/backend
    # GPU for experiments (torch / docling / local LMs). Needs the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace:cached
      # Dev-only caches
      - uv-cache:/home/vscode/.cache/uv
      - hf-cache:/home/vscode/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  # Slim, deployable-style backend image. Start with: docker compose --profile app up
  rag-backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rag-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rag-app-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-data:
  postgres-data:
  pgadmin-data:
  graphdb-data:
  minio-data:
  uv-cache:
  hf-cache:
