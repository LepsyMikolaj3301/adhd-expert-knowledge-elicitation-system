services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Host path for models (bind mount). Falls back to the named volume if unset.
      - ${OLLAMA_DATA_PATH:-ollama-data}:/root/.ollama
    restart: unless-stopped
    # Uncomment when running on a machine with an NVIDIA GPU:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  graphdb:
    image: ontotext/graphdb:11.5.2
    ports:
      - "${GRAPHDB_HOST_PORT:-7200}:7200"
    environment:
      GDB_JAVA_OPTS: >-
        -Xms1g -Xmx${GRAPHDB_HEAP_SIZE:-2g}
        -Dgraphdb.home=/opt/graphdb/home
    volumes:
      - graphdb-data:/opt/graphdb/home
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7200/rest/repositories >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates the GraphDB repository if it does not exist yet (idempotent).
  graphdb-init:
    image: curlimages/curl:latest
    depends_on:
      graphdb:
        condition: service_healthy
    environment:
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
    volumes:
      - ./backend/db/graphdb:/init:ro
    entrypoint: ["sh", "/init/init-repo.sh"]
    restart: "no"

  # Dev workspace: the devcontainer attaches here. Full toolchain, scripts, notebooks, experiments.
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
      PYTHONPATH: /workspace/backend
    # GPU for experiments (torch / docling / local LMs). Needs the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  # Slim, deployable-style backend image. Start with: docker compose --profile app up
  rag-backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-adhd-knowledge}
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-data:
  postgres-data:
  graphdb-data:
