# Render Blueprint: the two containers. The database is Neon, not Render.
# Setup and the deploy script: docs/deployment.md, infra/deploy.sh.
#
# autoDeploy is off on purpose: infra/deploy.sh migrates the database first, then triggers the
# backend, then the frontend, through each service's deploy hook.
services:
  - type: web
    name: rag-backend
    runtime: docker
    plan: free
    # The answers-only build: see docs/deployment.md, "An answers-only round".
    branch: answers-only
    dockerfilePath: ./infra/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_TTL_HOURS
        value: "12"
      # Reviews, the knowledge base and the home feed are switched off, and no job is reported running.
      - key: ANSWERS_ONLY
        value: "true"
      # Neon's POOLED connection string (host has -pooler). Set it in the dashboard.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: rag-frontend
    runtime: docker
    plan: free
    branch: answers-only
    dockerfilePath: ./infra/frontend.Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      # The backend's public address. Render can't hand a public URL to another service, so set
      # both after the backend exists: https://rag-backend-xxxx.onrender.com and rag-backend-xxxx.onrender.com
      - key: API_UPSTREAM_URL
        sync: false
      - key: API_HOST
        sync: false

