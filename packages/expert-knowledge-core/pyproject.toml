[project]
name = "expert-knowledge-core"
version = "0.1.0"
description = "Framework-free core of the expert knowledge RAG: BM25 sparse vectors, note packing, prompts, record types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pgvector>=0.3",
    "snowballstemmer>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expert_knowledge_core"]
