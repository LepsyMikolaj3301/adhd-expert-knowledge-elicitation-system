# The checks. Nothing here runs by itself: this is a one-person repo that works on main, so the checks
# are run by hand (Actions > CI > Run workflow) or as the first step of the Deploy workflow.
name: CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Not the root's default groups: they pull the notebooks and the script dependencies.
      - run: uv sync --frozen --no-default-groups --all-packages --group dev
      - run: uv run --no-sync ruff check backend
      - run: uv run --no-sync ruff format --check backend
      - run: uv run --no-sync ty check backend
      # No database, model or network: everything that talks to Ollama is replaced in these tests.
      # What needs Postgres (marked `integration`: tests/api, tests/integration and the package
      # integration tests) runs locally only, against the compose Postgres; the retrieval
      # regression also needs Ollama with bge-m3 (it ingests tests/fixtures/scale_answers):
      #   uv run pytest -m integration
      - name: Unit tests
        run: >-
          uv run --no-sync pytest -m "not integration"
          tests/unit tests/scripts tests/test_*.py
          packages/expert-knowledge-core/tests packages/expert-knowledge-rag/tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build-only
