[project]
name = "rag-workspace"
version = "0.0.0"
description = "Monorepo root: shared tooling and dependency groups for backend, scripts and experiments"
requires-python = ">=3.12"
dependencies = []

# Root is a virtual project; every deployable lives in a workspace member.
# packages/* are installable libraries (expert-knowledge-core is used by the backend too).
[tool.uv]
package = false
default-groups = ["dev", "notebooks", "scripts"]

[tool.uv.workspace]
members = ["backend", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pytest-asyncio>=0.24",
]
notebooks = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1",
    "jupyterlab>=4.3",
]
scripts = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0",
]
experiments = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "backend", "packages/expert-knowledge-core/src", "packages/expert-knowledge-rag/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["backend", "scripts/elicitation", "scripts/rag"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/expert-knowledge-core/tests", "packages/expert-knowledge-rag/tests"]
pythonpath = ["backend", "scripts/elicitation", "scripts/rag"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the Postgres of DATABASE_URL (pgvector); skipped when unreachable"]
