[project]
name = "rag-workspace"
version = "0.0.0"
description = "Monorepo root: shared tooling and dependency groups for backend, scripts and experiments"
requires-python = ">=3.12"
dependencies = []

# Root is a virtual project; every deployable lives in a workspace member.
# packages/* are installable libraries (expert-knowledge-core is used by the backend too).
[tool.uv]
package = false
default-groups = ["dev", "notebooks", "scripts"]

[tool.uv.workspace]
members = ["backend", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1",
    "jupyterlab>=4.3",
]
scripts = [
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0",
    "langchain-ollama>=1.0",
]
experiments = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "backend", "packages/expert-knowledge-core/src", "packages/expert-knowledge-rag/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# imports follow the sys.path setup, and the HTML strings are long
"notebooks/*.ipynb" = ["E402", "E501"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["backend", "scripts/elicitation", "scripts/rag"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/expert-knowledge-core/tests", "packages/expert-knowledge-rag/tests"]
pythonpath = ["backend", "scripts/elicitation", "scripts/rag", "scripts/db"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres of DATABASE_URL (pgvector); skipped when unreachable",
    "regression: retrieval quality on tests/fixtures/scale_answers ingested at test time (needs Postgres and Ollama with bge-m3; fails, not skips, without them when selected with -m)",
    "scale: retrieval curves with all 32 experts of tests/fixtures/scale_answers (needs Postgres and Ollama; about 2 min)",
]

# Fast run without a database, with coverage:
#   uv run pytest -m "not integration" --cov --cov-report=term-missing
[tool.coverage.run]
source = ["backend/app", "packages/expert-knowledge-core/src", "packages/expert-knowledge-rag/src"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
