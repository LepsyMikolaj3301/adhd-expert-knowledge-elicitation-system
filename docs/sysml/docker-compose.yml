# SysON images are multi-platform (linux/amd64 and linux/arm64) starting with v2026.9.0.
# To run an older version on an ARM architecture, execute this command in your shell first:
# export DOCKER_DEFAULT_PLATFORM=linux/amd64
version: "3.8"
services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - syson
  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2026.9.0}"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      - database
    networks:
      - syson
  sysml-pilot:
    # SysML v2 Pilot Implementation (OMG): Jupyter server with the "sysml" kernel, %viz -> SVG.
    # Only with the profile: docker compose --profile pilot up -d --build sysml-pilot
    profiles: ["pilot"]
    build: ./pilot
    ports:
      - "${PILOT_PORT:-8890}:8888"
    volumes:
      - ./src:/models:ro
    environment:
      # The kernel JVM loads the whole SysML standard library at start-up.
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    mem_limit: 3g
    command: >
      jupyter server --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token=${PILOT_TOKEN:-sysml} --ServerApp.allow_origin='*'
networks:
  syson:
