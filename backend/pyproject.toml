[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG backend for the ADHD expert knowledge elicitation system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
