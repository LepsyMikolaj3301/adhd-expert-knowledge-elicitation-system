[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG backend for the ADHD expert knowledge elicitation system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "docling>=2.0",
    "boto3>=1.35",
    "numpy>=2.0",
    "tokenizers>=0.20",
    "snowballstemmer>=3.1.1",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "pyyaml>=6.0",
    "wordfreq>=3.1",
    "expert-knowledge-core",
]

[tool.uv]
package = false

[tool.uv.sources]
expert-knowledge-core = { workspace = true }
